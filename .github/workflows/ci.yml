name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Install lint tools
        run: |
          brew install mint actionlint
          mint bootstrap
      - name: Lint
        run: make lint

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Install Mint and xcbeautify
        run: |
          git clone --depth 1 --branch 0.18.0 https://github.com/yonaskolb/Mint.git "$RUNNER_TEMP/Mint"
          swift build --package-path "$RUNNER_TEMP/Mint" -c release
          mint_bin="$(swift build --package-path "$RUNNER_TEMP/Mint" -c release --show-bin-path)"
          echo "$mint_bin" >> "$GITHUB_PATH"
          "$mint_bin/mint" install cpisciotta/xcbeautify
      - name: Release build
        run: swift build -c release 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Release tests
        run: swift test -c release 2>&1 | mint run --no-install cpisciotta/xcbeautify -q

  apple:
    needs: linux
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macOS
          - platform: iOS
            simulator-name: iPhone 17 Pro
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Install xcbeautify
        run: |
          brew install mint
          mint install cpisciotta/xcbeautify
      - name: Verify toolchain
        run: xcodebuild -version 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Select simulator
        id: simulator
        if: matrix.platform != 'macOS'
        env:
          SIMULATOR_NAME: ${{ matrix.simulator-name }}
          RUNTIME_PLATFORM: ${{ matrix.platform }}
        run: |
          device_type_identifier="$(xcrun simctl list devicetypes --json | jq -er --arg name "$SIMULATOR_NAME" 'first(.devicetypes[] | select(.name == $name) | .identifier)')"
          runtime_identifier="$(xcrun simctl list runtimes available --json | jq -er --arg platform "$RUNTIME_PLATFORM" '[.runtimes[] | select(.name | startswith($platform + " "))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')"
          if ! device_identifier="$(xcrun simctl list devices available --json | jq -er --arg name "$SIMULATOR_NAME" --arg runtime "$runtime_identifier" 'first(.devices[$runtime][] | select(.name == $name) | .udid)')"; then
            device_identifier="$(xcrun simctl create "$SIMULATOR_NAME" "$device_type_identifier" "$runtime_identifier")"
          fi
          echo "device-id=$device_identifier" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device-id }}
        run: |
          if [ '${{ matrix.platform }}' = 'macOS' ]; then
            swift build -c release 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          else
            xcodebuild build -scheme TaskLoom-Package -destination "id=$SIMULATOR_ID" 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          fi
      - name: Test
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device-id }}
        run: |
          if [ '${{ matrix.platform }}' = 'macOS' ]; then
            swift test -c release 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          else
            xcodebuild test -scheme TaskLoom-Package -destination "id=$SIMULATOR_ID" 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          fi
